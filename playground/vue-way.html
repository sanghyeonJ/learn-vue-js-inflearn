<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <script>
        var div = document.querySelector('#app');
        var viewModel = {};


        // 즉시실행함수 ( 유효범위 관리를 위함 )
        (function() {

            function init() {
                // 객체의 동작을 재정의하는 API
                // Object.defineProperty(대상 객체, 객체의 속성, {
                // ...정의할 내용
                // });
                Object.defineProperty(viewModel, 'str', {
                    // 속성에 접근했을때의 동작을 정의 ( viewModel.str 으로 접근 )
                    get: function() {
                        console.log('접근')
                    },
                    // 속성에 값을 할당했을때의 동작을 정의 ( newValue는 새로 할당된 값 )
                    set: function(newValue) {
                        console.log('할당', newValue);
                        render(newValue);
                    }
                });
            };

            function render(value) {
                div.innerHTML = value;
            };

            init();

        })();
        
    </script>
</body>
</html>
